<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AniQuiz 戀愛番</title><link rel="stylesheet" href="/style.css"></head><body><main><h1>💗 AniQuiz 戀愛番挑戰</h1><p>200 道困難題・每部作品 20 題・多人連線</p><section id="home"><input id="name" placeholder="你的暱稱" maxlength="12"><select id="anime"></select><button id="create">建立房間</button><div><input id="codein" placeholder="5 碼房號" maxlength="5"><button id="join">加入房間</button></div></section><section id="room" hidden><h2>房號：<b id="code"></b></h2><button id="copy">複製房號</button><h3 id="title"></h3><p id="status">等待玩家</p><ol id="players"></ol><button id="start" hidden>開始遊戲</button><div id="quiz" hidden><p id="num"></p><h2 id="question"></h2><div id="opts"></div><p id="feedback"></p><button id="next" hidden>下一題</button></div><div id="end" hidden><h2>🏆 遊戲結束</h2><ol id="scores"></ol><button onclick="location.reload()">回首頁</button></div></section></main><script src="/socket.io/socket.io.js"></script><script src="/script.js"></script></body></html>
